// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '1.9.10'
        compose_version = '1.5.3'
        compose_compiler_version = '1.5.3'
        hilt_version = '2.48'
        camerax_version = '1.3.0'
        mlkit_version = '17.1.0'
    }
}

plugins {
    id 'com.android.application' version '8.10.1' apply false
    id 'com.android.library' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.10' apply false
    id 'com.google.dagger.hilt.android' version '2.48' apply false
    id 'com.google.devtools.ksp' version '1.9.10-1.0.13' apply false
    id 'com.google.gms.google-services' version '4.4.0' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Download latest SDK AAR from GitHub Releases for sample-app (use: ./gradlew downloadSdkAarFromGitHub)
task downloadSdkAarFromGitHub(type: Exec) {
    def version = findProperty('SDK_VERSION_NAME') ?: '1.2.55'
    def libsDir = file("sample-app/libs")
    def aarFile = file("sample-app/libs/artiusid-sdk-${version}.aar")
    libsDir.mkdirs()
    commandLine 'curl', '-L', '-f', '-o', aarFile.absolutePath,
        "https://github.com/artius-iD/artiusid_sdk_android/releases/download/v${version}/artiusid-sdk-${version}.aar"
    doFirst {
        if (!aarFile.parentFile.exists()) aarFile.parentFile.mkdirs()
    }
    doLast {
        if (!aarFile.exists() || aarFile.length() == 0) {
            throw new GradleException("Download failed: ${aarFile}")
        }
        println "Downloaded artiusid-sdk-${version}.aar to sample-app/libs/"
    }
}
